# Cloudflare configuration for FuelMap.
#
# This is a Worker that also serves the built SPA:
#   build command:    npm run build          -> outputs ./dist
#   deploy command:   npx wrangler deploy
#
# The Worker (worker/index.ts) does two things:
#   - serves the static assets from ./dist (with SPA fallback),
#   - proxies /api/de/stations to Tankerkönig so the API key stays server-side.
#
# `keep_vars = true` preserves dashboard-configured variables across deploys.
# Secrets (e.g. TANKERKOENIG_API_KEY) are set once with:
#   npx wrangler secret put TANKERKOENIG_API_KEY
name = "fuelmap"
compatibility_date = "2026-10-01"
keep_vars = true

main = "worker/index.ts"

# Static single-page app served through the ASSETS binding.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Non-secret configuration. Values overridable from the dashboard.
[vars]
TANKERKOENIG_API_URL = "https://creativecommons.tankerkoenig.de/json/list.php"
BRANDFETCH_API_URL = "https://api.brandfetch.io/v2/brands"

# R2 cache bucket. It holds:
#  - the brand logos snapshotted from the Brandfetch Brand API (prefix
#    `brands-logo/`); Brandfetch's terms allow caching for 30 days and the cron
#    refreshes twice a month,
#  - the last trustworthy OpenStreetMap payload of each bounding box (prefix
#    `osm-last-good/`), served when every Overpass mirror is down,
#  - the French fixed-radar GeoJSON snapshot (prefix `radars-fr/`), refreshed
#    from data.gouv.fr by the cron.
[[r2_buckets]]
binding = "BRANDS_BUCKET"
bucket_name = "fuelmap-bucket"

[triggers]
crons = ["0 4 1,16 * *"]
